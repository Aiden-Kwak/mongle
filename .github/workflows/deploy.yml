name: Database Backup and Deployment

on:
  push:
    branches:
      - main  # main 브랜치에 push될 때 트리거

jobs:
  backup_and_deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. 코드 체크아웃
    - name: Checkout code
      uses: actions/checkout@v3

    # 2. SSH 연결 설정
    - name: Set up SSH
      uses: webfactory/ssh-agent@v0.5.3
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    # 3. 서버에서 스크립트 실행
    - name: Run backup script
      run: ssh -o StrictHostKeyChecking=no ubuntu@15.165.203.242 "/home/ubuntu/scripts/backup_db.sh"

    #- name: Redeploy Docker Stack
      #run: ssh -o StrictHostKeyChecking=no ubuntu@15.165.203.242 "docker stack deploy -c /home/ubuntu/docker-compose.yml mongles"
